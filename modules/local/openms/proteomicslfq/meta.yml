name: proteomicslfq
description: ProteomicsLFQ performs label-free quantification of peptides and proteins.
keywords:
  - label-free
  - OpenMS
  - quantification
tools:
  - ProteomicsLFQ:
      description: |
        ProteomicsLFQ performs label-free quantification of peptides and proteins.
      homepage: https://abibuilder.cs.uni-tuebingen.de/archive/openms/Documentation/release/latest/html/UTILS_ProteomicsLFQ.html
      documentation: https://abibuilder.cs.uni-tuebingen.de/archive/openms/Documentation/release/latest/html/UTILS_ProteomicsLFQ.html
input:
  - mzmls:
      type: file
      description: Input spectra (mzML, Thermo .raw or Bruker .d). Empty when combining feature checkpoints.
      pattern: "*.{mzML,raw,d}"
  - id_files:
      type: file
      description: Identifications with posterior error probabilities as score type. Empty when combining feature checkpoints.
      pattern: "*.idparquet"
  - expdes:
      type: file
      description: An experimental design file
      pattern: "*.tsv"
  - fasta:
      type: file
      description: A protein database in with appended decoy sequences in FASTA format.
      pattern: "*.{fasta,fa}"
  - checkpoints:
      type: directory
      description: |
        ProteomicsLFQ feature checkpoints (one per run) produced by PROTEOMICSLFQ_DETECT.
        When given, the tool combines them (-feat_dir) instead of running feature detection.
      pattern: "*.featureParquet"
  - feature_args:
      type: string
      description: Feature-detection parameters; must be identical to the ones used to create the checkpoints.
output:
  - out_consensusXML:
      type: file
      description: ConsensusXML file for visualization and further processing in OpenMS.
      pattern: "*.consensusXML"
  - out_msstats:
      type: file
      description: MSstats file with analysis results for statistical downstream analysis in MSstats.
      pattern: "*msstats_in.csv"
  - log:
      type: file
      description: log file
      pattern: "*.log"
  - version:
      type: file
      description: File containing software version
      pattern: "versions.yml"
authors:
  - "@daichengxin"
