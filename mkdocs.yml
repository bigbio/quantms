site_name: quantms
docs_dir: mkdocs
site_description: Cloud-ready Nextflow pipeline for DDA quantitative proteomics
site_author: BigBio Team
site_url: https://docs.quantms.org/
repo_name: bigbio/quantms
repo_url: https://github.com/bigbio/quantms
theme:
  name: material
  custom_dir: mkdocs/overrides
  font: false
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
extra_css:
  - https://quantms.org/css/quantms-theme.css
nav:
  - Home: index.md
  - Key Concepts: concepts.md
  - Getting Started:
    - Installation: installation.md
    - Input Files: input.md
    - File Formats: formats.md
  - Workflows:
    - Overview: workflows.md
    - Label-Free (LFQ): lfq.md
    - Isobaric (TMT/iTRAQ): tmt.md
  - Analysis:
    - Search Engines: search-engines.md
    - PSM Rescoring: rescoring.md
    - Usage Guide: usage.md
  - Results:
    - Output Files: output.md
  - Help:
    - Troubleshooting: troubleshooting.md
    - FAQ: faq.md
  - Publications: publications.md

extra:
  analytics:
    provider: google
    property: G-6PL70G5VC1

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 2
